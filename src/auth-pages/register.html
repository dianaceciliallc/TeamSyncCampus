<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Create account | Team Sync</title>
	<meta name="theme-color" content="#f5f6fa">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="../css/styles.css">
	<script type="module" src="../js/authInit.js"></script>
</head>

<body class="auth-page">
	<main class="auth-card">
		<header class="auth-card__header">
			<img src="../assets/team-sync-logo.png" alt="TeamSync logo" class="brand-logo">
			<h1>Create your account</h1>
			<p>Join your team and keep every milestone in sync.</p>
		</header>

		<form class="auth-form" data-action="register">
			<p role="alert" hidden></p>

			<label for="register-name">Full name</label>
			<input type="text" id="register-name" name="name" autocomplete="name" required minlength="2"
				placeholder="Jane Doe">

			<label for="register-email">Email</label>
			<input type="email" id="register-email" name="email" autocomplete="email" required
				placeholder="you@university.edu">

			<label for="register-password">Password</label>
			<input type="password" id="register-password" name="password" autocomplete="new-password" required
				minlength="8" placeholder="At least 8 characters">

			<label for="register-confirm">Confirm password</label>
			<input type="password" id="register-confirm" name="confirmPassword" autocomplete="new-password" required
				minlength="8" placeholder="Repeat your password">

			<button type="submit">Create account</button>
		</form>

		<p class="auth-card__footer">
			Already have an account? <a href="login.html">Sign in</a>
		</p>
	</main>
</body>

</html>
