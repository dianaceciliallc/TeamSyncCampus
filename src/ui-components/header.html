<div class="header-container">
    <div class="header-left">
        <a href="index.html" class="brand-link" aria-label="TeamSync Home">
            <img src="assets/team-sync-logo.png" alt="TeamSync Brand Logo" class="brand-logo">
            <span class="brand-info">
                <span class="brand-name">TeamSync</span>
                <span class="brand-subtitle">Campus Studio</span>
            </span>
        </a>
    </div>

    <div class="header-center">
        <div class="course-selector">
            <label for="courses">Choose a course:</label>
            <select class="courses-select" name="courses" id="courses">
                <option value="all" selected>All</option>
            </select>
        </div>

        <label class="search-bar">
            <span class="icon-search" aria-hidden="true"></span>
            <input type="search" data-project-search placeholder="Search capstones, tasks, teammates or resources..."
                aria-label="Search projects, tasks, teammates or resources">
        </label>
    </div>

    <div class="header-right">
        <button class="btn btn-primary-pill" type="button" data-create-project>
            <span>Create Project</span>
            <span class="btn-arrow-circle" aria-hidden="true">
                <span class="icon-arrow"></span>
            </span>
        </button>

        <span class="header-divider" aria-hidden="true"></span>

        <div class="profile-menu-wrapper">
            <button class="user-avatar-btn" type="button" aria-label="Open profile menu" aria-haspopup="true"
                aria-expanded="false" data-profile-toggle>
                <span class="avatar-initials">KM</span>
                <span class="online-status-dot" title="Online"></span>
            </button>
            <div class="profile-menu" data-profile-menu>
                <a href="auth-pages/login.html" data-sign-out>Sign out</a>
            </div>
        </div>
    </div>
</div>
